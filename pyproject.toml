[project]
name = "graft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gabewillen", email = "gabewillen@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.11.0",
    "openai>=3.24.0",
    "stateforward-hsm>=1.3.11",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "cactus-needle>=3.0.2,<4.0.0",
    "pytest>=9.1.1",
    "typesafe-sdk>=0.6.0,<1.0.0",
]

[project.scripts]
graft = "graft.cli:main"

[project.optional-dependencies]
jev = [
    "typesafe-sdk>=0.6.0,<1.0.0",
]
