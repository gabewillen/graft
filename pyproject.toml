[project]
name = "graft"
version = "0.1.0"
description = "Experimental alternative to subagents for LLM agent delegation: clones seeded from the parent's own context, joined back by pointer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Gabe Willen", email = "gabewillen@gmail.com" }
]
requires-python = ">=3.13"
keywords = ["llm", "agents", "subagents", "delegation", "context", "multi-agent", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=1.11.0",
    "openai>=3.24.0",
    "stateforward-hsm>=1.3.11",
]

[project.urls]
Homepage = "https://github.com/gabewillen/graft"
Repository = "https://github.com/gabewillen/graft"
Issues = "https://github.com/gabewillen/graft/issues"
Specification = "https://github.com/gabewillen/graft/blob/main/spec.md"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "cactus-needle>=3.0.2,<4.0.0",
    "pytest>=9.1.1",
    "typesafe-sdk>=0.6.0,<1.0.0",
]

[project.scripts]
graft = "graft.cli:main"

[project.optional-dependencies]
jev = [
    "typesafe-sdk>=0.6.0,<1.0.0",
]
