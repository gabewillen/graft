name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install ripgrep (used by the replay sandbox tests)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install
        run: uv sync --locked
      - name: Test (offline, no API keys)
        run: uv run --locked pytest -q
      - name: Build
        run: uv build
